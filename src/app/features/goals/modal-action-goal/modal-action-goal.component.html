<main class="goal-modal-container p-4">
    <section class="d-flex justify-content-between align-items-center mb-2">
        <h4 class="fw-bold m-0">{{ mode === 'edit' ? 'Editar Meta' : 'Nova Meta' }}</h4>

        <button type="button" class="btn-close" aria-label="Fechar" (click)="closeModal()"></button>
    </section>

    <form [formGroup]="goalForm" (submit)="onSubmit()" novalidate class="d-flex flex-column gap-3">
        <div class="d-flex flex-column">
            <span class="fw-bold inp-title">Nome da meta*</span>
            <div class="input-standard" [class.invalid-error]="goalForm.controls.title.invalid &&
				(goalForm.controls.title.dirty || goalForm.controls.title.touched)">
                <input type="text" name="title" placeholder="Ex: Notebook novo" formControlName="title" />
            </div>
        </div>

        <div class="d-flex flex-column">
            <span class="fw-bold inp-title">Valor alvo (R$)*</span>
            <div class="input-standard" [class.invalid-error]="goalForm.controls.targetValue.invalid &&
				(goalForm.controls.targetValue.dirty || goalForm.controls.targetValue.touched)">
                <input type="text" inputmode="decimal" currencyMask name="targetValue" placeholder="R$ 0,00"
                    formControlName="targetValue" />
            </div>
        </div>

        <div class="d-flex flex-column">
            <span class="fw-bold inp-title">Valor Guardado (R$)</span>
            <div class="input-standard" [class.invalid-error]="goalForm.controls.savedValue.invalid &&
				(goalForm.controls.savedValue.dirty || goalForm.controls.savedValue.touched)">
                <input type="text" inputmode="decimal" currencyMask name="savedValue" placeholder="R$ 0,00"
                    formControlName="savedValue" />
            </div>
        </div>

        <div class="d-flex flex-column">
            <span class="fw-bold inp-title">Prazo (opcional)</span>
            <div class="input-standard">
                <input type="date" name="limitDate" placeholder="dd/mm/aaaa" formControlName="limitDate" />
            </div>
        </div>

        <div class="d-flex flex-column">
            <span class="fw-bold inp-title">Icone (emoji)</span>
            <div class="icon-options d-flex gap-2 flex-wrap">
                @for (icon of icons; track icon.id) {
                <button type="button" class="btn btn-icon-option"
                    [class.active]="goalForm.controls.icon.value === icon.id" [attr.aria-label]="icon.label"
                    (click)="selectIcon(icon.id)">
                    <span>{{ icon.visual }}</span>
                </button>
                }
            </div>
        </div>

        @if (submitError) {
        <small class="color-error">{{ submitError }}</small>
        }

        <button type="submit" class="btn btn-fi-success w-100" [disabled]="isSubmitting">
            {{ isSubmitting ? 'Salvando...' : mode === 'edit' ? 'Salvar alterações' : 'Criar Meta' }}
        </button>
    </form>
</main>
