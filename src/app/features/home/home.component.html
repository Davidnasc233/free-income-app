<main class="mt-5">
    <div>
        <h2 class="fw-bold m-0">E aí, {{ user?.name }}!</h2>
        <span class="text-muted">Seu resumo financeiro de hoje</span>
    </div>

    <section class="mt-3">
        <app-balance></app-balance>
    </section>

    <section class="w-100">
        <button class="button-balance d-flex align-items-center w-100 justify-content-center gap-2"
            (click)="openAddTransactionModal()">
            <i class="ph ph-plus text-white"></i>
            <span class="text-white">Registrar gasto ou receita</span>
        </button>
    </section>

    <section>
        <app-home-goals></app-home-goals>
    </section>

    <section class="mt-2">
        <app-history-transactions (viewAll)="goToTransactions()"></app-history-transactions>
    </section>

    <section class="tip-banner mt-3" role="note" aria-label="Dica financeira">
        <span>Dica: Registrar seus gastos todos os dias é o primeiro passo para ter controle da sua grana!</span>
    </section>
</main>
