<main class="home-page mt-5">
    <app-page-state [loading]="isLoading" [error]="loadError" loadingMessage="Carregando página inicial...">
        <section class="d-flex flex-row align-items-center justify-content-between mb-4">
            <div>
                <h2 class="fw-bold m-0">E aí, {{ user?.name }}!</h2>
                <span class="desktop text-muted">{{ today | date: "EEEE, d 'de' MMMM 'de' yyyy"}}</span>
                <span class="mobile text-muted">{{ today | date: "d 'de' MMMM 'de' yyyy"}}</span>
            </div>
            <section>
                <button class="button-balance px-3 py-2 d-flex align-items-center w-100 justify-content-center gap-2"
                    (click)="openAddTransactionModal()">
                    <i class="ph ph-plus text-white"></i>
                    <span class="text-white">Nova Transação</span>
                </button>
            </section>
        </section>

        <section class="mb-4">
            <app-balance></app-balance>
        </section>

        <section class="dashboard-grid">
            <div class="dashboard-card">
                <app-history-transactions (viewAll)="redirectTo('transactions')"></app-history-transactions>
            </div>

            <div class="dashboard-card">
                <app-home-goals></app-home-goals>
            </div>
        </section>

        <section class="quick-links mt-4">
            <h6 class="fw-bold mb-3">Acesso rápido</h6>
            <div class="d-flex flex-wrap gap-2">
                <button type="button" class="quick-link-btn" (click)="redirectTo('transactions')">
                    <i class="ph ph-arrows-left-right"></i>
                    <span>Transações</span>
                </button>
                <button type="button" class="quick-link-btn" (click)="redirectTo('goals')">
                    <i class="ph ph-target"></i>
                    <span>Metas</span>
                </button>
                <button type="button" class="quick-link-btn" (click)="redirectTo('graphics')">
                    <i class="ph ph-chart-bar"></i>
                    <span>Gráficos</span>
                </button>
            </div>
        </section>

        <section class="tip-banner mt-3" role="note" aria-label="Dica financeira">
            <span>Dica: Registrar seus gastos todos os dias é o primeiro passo para ter controle da sua grana!</span>
        </section>
    </app-page-state>
</main>
