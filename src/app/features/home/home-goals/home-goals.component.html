<main class="d-flex flex-column gap-2">
    <section>
        <div class="d-flex justify-content-between align-items-center">
            <h5 class="fw-bold">
                Metas
            </h5>

            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-view" type="button" (click)="onViewAllGoals()">
                    <small>Ver todas</small>
                </button>
            </div>
        </div>
    </section>

    <app-page-state [loading]="isLoading" [error]="loadError" [empty]="goals.length === 0"
        loadingMessage="Carregando metas recentes..." emptyMessage="Ainda não há metas. Crie sua primeira meta.">
        <section class="d-flex flex-column gap-3">
            @for (goal of goals; track goal.id) {
            <div class="d-flex flex-row card gap-2 px-3 py-2">
                <div class="d-flex align-items-center">
                    <i class="goal-icon" [class]="'ph ' + goal.icon"></i>
                </div>

                <div class="w-100">
                    <div class="d-flex align-items-center justify-content-between">
                        <span>
                            {{ goal.title }}
                        </span>

                        <span>
                            {{ getProgressPercent(goal) }}%
                        </span>
                    </div>

                    <div class="goal-progress mt-1">
                        <div class="goal-progress-fill" [style.width.%]="getProgressPercent(goal)"></div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mt-1 progress-values">
                        <small>{{ formatCurrency(goal.actualValue) }}</small>
                        <small>De {{ formatCurrency(goal.targetValue) }}</small>
                    </div>
                </div>
            </div>
            }
        </section>

        <div pageEmpty class="d-flex justify-content-center mt-2">
            <button class="btn btn-create-goal" type="button" (click)="onCreateGoal()">
                Criar meta
            </button>
        </div>
    </app-page-state>
</main>
