<section class="user-toolbar-content">
    <header class="user-toolbar-header">
        <span class="user-name">Minha Conta</span>
        <small class="text-muted">Gerencie suas preferencias</small>
    </header>

    <div class="user-toolbar-actions">
        <button type="button" class="user-toolbar-item" (click)="goToSettings()">
            <i class="ph ph-user-circle"></i>
            Meu Perfil
        </button>

        <button type="button" class="user-toolbar-item">
            <i class="ph ph-chat-teardrop-text"></i>
            Fale Conosco
        </button>

        <button type="button" class="user-toolbar-item danger" (click)="onLogout()" [disabled]="isLoggingOut">
            <i class="ph ph-sign-out"></i>
            {{ isLoggingOut ? 'Saindo...' : 'Sair' }}
        </button>
    </div>
</section>
